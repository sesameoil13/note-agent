name: Windows build (manual)

# Manual only. Standard GitHub-hosted runners are free for public repositories;
# re-check billing before running this if the repository becomes private.
# A hosted runner validates compilation and tests; it is not Windows 11
# desktop acceptance. Lives on the default branch and checks out `ref`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: codex/implement-spec-1

permissions:
  contents: read

concurrency:
  group: windows-manual-build-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      # The runner context is not available in job-level env.
      - name: Use a job-local pub cache
        run: |
          "PUB_CACHE=$env:RUNNER_TEMP\note-agent-pub-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install checksum-pinned official Flutter SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flutter-3.47.7.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'note-agent-sdk'
          $url = 'https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.7-stable.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'c2c875da25a1a1448d18ee4e8f398b2f6fce888b4775d8f9130538e16d826cb4'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Flutter SDK checksum did not match the reviewed official release.'
          }
          Expand-Archive -Path $archive -DestinationPath $sdk
          $flutter = Join-Path $sdk 'flutter\bin'
          $flutter | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$flutter\flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile

      # Budget tests start the local Worker harness in services/pairing.
      - name: Install locked pairing service packages
        working-directory: services/pairing
        run: |
          node --version
          npx --yes pnpm@12.5.1 install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify workspace behavior on Windows
        run: flutter test --no-pub

      - name: Analyze
        run: flutter analyze --no-pub

      # Also compile after a test or analyzer failure, so one run reports both.
      - name: Build Windows x64 release
        if: ${{ !cancelled() }}
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected an x64 runner.' }
          flutter build windows --release --no-pub

      - name: Package bounded release artifact
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path (Join-Path $release 'note_agent.exe'))) { throw 'Release executable is missing.' }
          $bytes = (Get-ChildItem $release -File -Recurse | Measure-Object -Property Length -Sum).Sum
          if ($bytes -gt 100MB) { throw 'Release directory exceeds the 100 MiB artifact cap.' }
          $bundle = Join-Path $env:RUNNER_TEMP 'note-agent-windows-x64.zip'
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath $bundle
          if ((Get-Item $bundle).Length -gt 100MB) { throw 'Compressed release exceeds the 100 MiB artifact cap.' }

      # Only the release bundle is retained. No database, vault, credentials,
      # test scratch directories, pub cache, or SDK are uploaded.
      - name: Retain release bundle for one day
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: note-agent-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/note-agent-windows-x64.zip
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          compression-level: 0
